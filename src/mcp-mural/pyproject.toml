[project]
name = "mural-mcp"
version = "0.1.0"
description = "Mural MCP server — exposes Mural board operations as MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mural-mcp = "mural_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mural_mcp", "event_storming"]
